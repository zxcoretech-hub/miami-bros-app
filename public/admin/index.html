<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Miami Bro's</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/tailwind-config.js"></script>
</head>
<body class="bg-background min-h-screen flex hidden" id="app-body">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-surface-container-lowest border-r border-surface-container flex flex-col hidden md:flex">
        <div class="p-6 flex items-center gap-3 border-b border-surface-container">
            <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center shadow-md">
                <img src="../assets/logo.png" alt="Logo" class="w-8 h-8 object-contain" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3075/3075977.png'">
            </div>
            <h2 class="font-display-sm font-black text-xl text-on-surface">Admin</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 bg-secondary-container text-on-secondary-container px-4 py-3 rounded-xl font-label-md font-bold transition-colors">
                <span class="material-symbols-outlined">inventory_2</span>
                Productos
            </a>
        </nav>
        <div class="p-4 border-t border-surface-container">
            <button id="logout-btn" class="w-full flex items-center justify-center gap-2 text-error hover:bg-error-container/50 px-4 py-3 rounded-xl font-label-md font-bold transition-colors">
                <span class="material-symbols-outlined">logout</span>
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Topbar Mobile -->
        <header class="md:hidden bg-surface-container-lowest border-b border-surface-container p-4 flex justify-between items-center">
            <h2 class="font-display-sm font-black text-xl text-on-surface">Miami Bro's</h2>
            <button id="logout-btn-mobile" class="text-error">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </header>

        <!-- Dashboard Content -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="font-display-md text-3xl font-black text-on-surface">Gestión de Menú</h1>
                    <p class="text-on-surface-variant font-body-md mt-1">Administra tus productos y precios en tiempo real.</p>
                </div>
                <button id="btn-add-product" class="bg-primary hover:bg-surface-tint text-white px-6 py-3 rounded-xl font-label-lg font-bold shadow-md hover:shadow-lg transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined">add</span>
                    Nuevo Producto
                </button>
            </div>

            <!-- Tabla de Productos -->
            <div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-surface-container overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-surface-container-low text-on-surface-variant font-label-md uppercase tracking-wider border-b border-surface-container">
                                <th class="p-4 font-bold">Producto</th>
                                <th class="p-4 font-bold">Precio</th>
                                <th class="p-4 font-bold">Insignia</th>
                                <th class="p-4 font-bold">Estado</th>
                                <th class="p-4 font-bold text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body" class="divide-y divide-surface-container">
                            <tr>
                                <td colspan="5" class="p-8 text-center text-on-surface-variant">
                                    <span class="material-symbols-outlined animate-spin text-3xl">refresh</span>
                                    <p class="mt-2">Cargando productos...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form (Hidden by default) -->
    <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <!-- Backdrop -->
        <div id="modal-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity"></div>
        
        <!-- Modal Content -->
        <div class="bg-surface-container-lowest rounded-3xl shadow-xl w-full max-w-2xl mx-4 relative z-10 max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-surface-container flex justify-between items-center sticky top-0 bg-surface-container-lowest z-20">
                <h2 id="modal-title" class="font-display-sm text-2xl font-black text-on-surface">Nuevo Producto</h2>
                <button id="btn-close-modal" class="text-on-surface-variant hover:text-error transition-colors">
                    <span class="material-symbols-outlined text-3xl">close</span>
                </button>
            </div>
            
            <form id="product-form" class="p-6 space-y-6">
                <input type="hidden" id="prod-id">
                <input type="hidden" id="prod-old-image">
                <input type="hidden" id="prod-orden">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Titulo -->
                    <div class="col-span-full">
                        <label class="block font-label-md text-on-surface-variant mb-2">Título del Producto</label>
                        <input type="text" id="prod-titulo" required class="w-full bg-surface-container-low border border-surface-container rounded-xl px-4 py-3 outline-none focus:border-primary text-on-surface">
                    </div>

                    <!-- Precio -->
                    <div>
                        <label class="block font-label-md text-on-surface-variant mb-2">Precio (USD)</label>
                        <input type="number" step="0.01" id="prod-precio" required class="w-full bg-surface-container-low border border-surface-container rounded-xl px-4 py-3 outline-none focus:border-primary text-on-surface">
                    </div>

                    <!-- Insignia -->
                    <div>
                        <label class="block font-label-md text-on-surface-variant mb-2">Insignia (Ej: NUEVO)</label>
                        <input type="text" id="prod-insignia" class="w-full bg-surface-container-low border border-surface-container rounded-xl px-4 py-3 outline-none focus:border-primary text-on-surface">
                    </div>

                    <!-- Insignia Color -->
                    <div class="col-span-full">
                        <label class="block font-label-md text-on-surface-variant mb-2">Color de Insignia</label>
                        <select id="prod-insignia-color" class="w-full bg-surface-container-low border border-surface-container rounded-xl px-4 py-3 outline-none focus:border-primary text-on-surface">
                            <option value="bg-primary text-on-primary">Rojo (Primary)</option>
                            <option value="bg-secondary-container text-on-secondary-container">Amarillo (Secondary)</option>
                            <option value="bg-amber-400 text-on-secondary-container">Dorado Oscuro</option>
                        </select>
                    </div>

                    <!-- Descripción -->
                    <div class="col-span-full">
                        <label class="block font-label-md text-on-surface-variant mb-2">Descripción</label>
                        <textarea id="prod-descripcion" rows="3" required class="w-full bg-surface-container-low border border-surface-container rounded-xl px-4 py-3 outline-none focus:border-primary text-on-surface resize-none"></textarea>
                    </div>

                    <!-- Mensaje WhatsApp -->
                    <div class="col-span-full">
                        <label class="block font-label-md text-on-surface-variant mb-2">Mensaje Base para WhatsApp</label>
                        <input type="text" id="prod-wa" required class="w-full bg-surface-container-low border border-surface-container rounded-xl px-4 py-3 outline-none focus:border-primary text-on-surface">
                    </div>

                    <!-- Enlace PedidosYa (Fase 7) -->
                    <div class="col-span-full">
                        <label class="block font-label-md text-on-surface-variant mb-2">Enlace PedidosYa (Opcional)</label>
                        <input type="url" id="prod-pedidosya" class="w-full bg-surface-container-low border border-surface-container rounded-xl px-4 py-3 outline-none focus:border-primary text-on-surface" placeholder="https://www.pedidosya.com/...">
                    </div>

                    <!-- Imagen -->
                    <div class="col-span-full">
                        <label class="block font-label-md text-on-surface-variant mb-2">Imagen del Producto</label>
                        <input type="file" id="prod-imagen" accept="image/png, image/jpeg, image/webp" class="w-full bg-surface-container-low border border-surface-container rounded-xl px-4 py-3 outline-none focus:border-primary text-on-surface">
                        <p class="text-xs text-on-surface-variant mt-1">Deja vacío si no deseas cambiar la imagen actual.</p>
                        <img id="img-preview" src="" class="mt-4 h-32 rounded-lg object-cover hidden border border-surface-container">
                    </div>

                    <!-- Estado Activo -->
                    <div class="col-span-full flex items-center gap-3">
                        <input type="checkbox" id="prod-activo" class="w-5 h-5 text-primary border-surface-container rounded">
                        <label class="font-label-md text-on-surface cursor-pointer" for="prod-activo">Producto Activo (Visible al público)</label>
                    </div>
                </div>

                <div class="flex justify-end gap-4 pt-6 border-t border-surface-container">
                    <button type="button" id="btn-cancel-modal" class="px-6 py-3 rounded-xl font-bold text-on-surface-variant hover:bg-surface-container-low transition-colors">Cancelar</button>
                    <button type="submit" id="btn-save-product" class="bg-primary hover:bg-surface-tint text-white px-8 py-3 rounded-xl font-bold shadow-md transition-transform transform hover:scale-105 flex items-center gap-2">
                        <span class="material-symbols-outlined">save</span>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Auth Guard Script -->
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/admin.js"></script>
    <script>
        // Reveal body on auth
        import('../js/firebase.js').then((firebaseMod) => {
            import('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js').then((authMod) => {
                authMod.onAuthStateChanged(firebaseMod.auth, (user) => {
                    if (user) {
                        document.getElementById('app-body').classList.remove('hidden');
                    }
                });
            });
        });
        document.getElementById('logout-btn-mobile')?.addEventListener('click', () => {
            document.getElementById('logout-btn')?.click();
        });
    </script>
</body>
</html>
