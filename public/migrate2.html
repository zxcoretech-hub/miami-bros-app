    async function migrarDatos() {
      const status = document.getElementById("status");
      try {
        let contador = 9; // Empezar IDs desde el 9 porque ya hay 8 productos previos
        for (let item of nuevosPlatos) {
          const docId = 'prod-' + String(contador).padStart(3, '0');
          const prodData = {
            titulo: item.titulo,
            descripcion: item.descripcion,
            precio: item.precio,
            precioStr: '$' + item.precio.toFixed(2) + ' USD',
            insignia: item.categoria === "Especiales" || item.categoria === "Hamburguesas" ? "RECOMENDADO" : "",
            insignia_color: "bg-secondary-container text-on-secondary-container",
            imagen_url: "https://placehold.co/400x300?text=" + encodeURIComponent(item.titulo), // Placeholder image
            mensaje_wa: "Hola quiero pedir " + item.titulo,
            link_pedidos_ya: "https://www.pedidosya.com.pa/restaurantes/ciudad-de-panama/miami-bros-b23a9997-e5ff-4f03-8fe9-9bfe2e0f757c-menu",
            orden: contador,
            activo: true
          };
          
          await setDoc(doc(db, "productos", docId), prodData);
          console.log("Subido: " + prodData.titulo);
          contador++;
        }
        status.innerHTML = "<h2 style='color:green;'>¡32 productos nuevos subidos exitosamente!</h2><p>Ya puedes cerrar esta pestaña y ver tu menú.</p>";
      } catch (error) {
        console.error("Error al migrar:", error);
        status.innerText = "Error: " + error.message;
      }
    }

    window.onerror = function(msg) {
      document.getElementById("status").innerText = "Error crítico: " + msg;
    };

    migrarDatos();
  </script>
